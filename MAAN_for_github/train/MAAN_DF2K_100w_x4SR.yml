name: SMFANet_fin_4SR
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: /mnt/HDD_2T/dataset/sr/DF2K_HR_sub
    dataroot_lq: /mnt/HDD_2T/dataset/sr/DF2K_x4_sub
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

#    color_jitter: False
#    color_config:
#      brightness: 0.02
#      contrast: 0.02
#      saturation: 0.02
#      hue: 0.02

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 10
    prefetch_mode: ~

  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/original
    dataroot_lq: datasets/Set5/LRbicx4
    filename_tmpl : "{}"
    io_backend:
      type: disk

  val_2:
    name: val_set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/original
    dataroot_lq: datasets/Set14/LRbicx4
    filename_tmpl: "{}"
    io_backend:
      type: disk


# network structures
network_g:
  type: SMFANet
  dim: 36
  n_blocks: 8
  ffn_scale: 2
  upscaling_factor: 4

# path
path:
  pretrain_network_g: experiments/SMFANet_all_2nlsa_x4SR/models/net_g_930000.pth
  strict_load_g: False
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-3
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 1000000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  fft_opt:
    type: FFTLoss
    loss_weight: 0.05
    reduction: mean

# validation settings
val:
  val_freq: !!float 5000
  save_img: False
  pbar: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      better: higher  # the higher, the better. Default: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
      better: higher  # the higher, the better. Default: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
